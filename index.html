<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veo App - Lái mượt, Quản lý chuẩn</title>
  <meta name="description" content="Ứng dụng taplo theo dõi và quản lý xe thực tế trực quan, tích hợp AI Trợ lý lái xe thông minh và điều khiển giọng nói hai chiều.">
  <meta property="og:title" content="Veo App - Lái mượt, Quản lý chuẩn">
  <meta property="og:description" content="Ứng dụng taplo theo dõi và quản lý xe thực tế trực quan, tích hợp AI Trợ lý lái xe thông minh và điều khiển giọng nói hai chiều.">
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veo App">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // GitHub Pages trailing slash fixer:
    // If accessed as /veoveo-app without trailing slash, relative paths like ./assets fail with 404.
    // Redirect immediately to /veoveo-app/ so relative JS and CSS bundles load properly.
    if (window.location.pathname === '/veoveo-app') {
      window.location.replace('/veoveo-app/' + window.location.search + window.location.hash);
    }
  </script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="margin: 0; background-color: #030712; color: #f8fafc; font-family: 'Be Vietnam Pro', sans-serif;">
  <div id="root">
    <!-- Initial Loading State to prevent white flash -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1e293b 0%, #030712 100%);">
      <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <div style="position: absolute; inset: 0; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: veoSpin 1s linear infinite;"></div>
        <span style="font-size: 28px;">🚗</span>
      </div>
      <div style="font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px;">Veo App</div>
      <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Đang tải taplo điều khiển...</div>
    </div>
    <style>
      @keyframes veoSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update().catch(() => {});
          reg.onupdatefound = () => {
            const installing = reg.installing;
            if (installing) {
              installing.onstatechange = () => {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, automatically reload to show updated UI
                  window.location.reload();
                }
              };
            }
          };
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
